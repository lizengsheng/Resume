<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Medical-Qwen 后训练流程</title>
  <desc id="desc">从高相关数据到普通与急症双链路训练的抽象流程图</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f315b"/>
      <stop offset="1" stop-color="#276daf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#07172b" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="960" height="600" rx="42" fill="url(#bg)"/>
  <circle cx="804" cy="112" r="130" fill="#f1bd4a" opacity=".16"/>
  <circle cx="120" cy="522" r="180" fill="#9cc8f5" opacity=".1"/>
  <text x="70" y="88" fill="#cfe5ff" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">POST-TRAINING PIPELINE</text>
  <text x="70" y="145" fill="#fff" font-family="Arial, sans-serif" font-size="45" font-weight="800">Medical-Qwen</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="230" width="178" height="118" rx="22" fill="#fff" fill-opacity=".96"/>
    <text x="159" y="276" text-anchor="middle" fill="#173f73" font-size="22" font-weight="800">20K SFT</text>
    <text x="159" y="310" text-anchor="middle" fill="#60748d" font-size="16">高相关医疗数据</text>
    <rect x="286" y="230" width="178" height="118" rx="22" fill="#fff" fill-opacity=".96"/>
    <text x="375" y="276" text-anchor="middle" fill="#173f73" font-size="22" font-weight="800">2K DPO</text>
    <text x="375" y="310" text-anchor="middle" fill="#60748d" font-size="16">结构偏好对齐</text>
    <rect x="502" y="230" width="178" height="118" rx="22" fill="#fff" fill-opacity=".96"/>
    <text x="591" y="276" text-anchor="middle" fill="#173f73" font-size="22" font-weight="800">PPO</text>
    <text x="591" y="310" text-anchor="middle" fill="#60748d" font-size="16">普通问诊质量</text>
    <rect x="718" y="230" width="178" height="118" rx="22" fill="#f1bd4a"/>
    <text x="807" y="276" text-anchor="middle" fill="#13233a" font-size="22" font-weight="800">GRPO</text>
    <text x="807" y="310" text-anchor="middle" fill="#31445d" font-size="16">急症安全结构</text>
  </g>
  <g fill="none" stroke="#dcecff" stroke-width="3" stroke-linecap="round">
    <path d="M248 289h30"/>
    <path d="M464 289h30"/>
    <path d="M680 289h30"/>
  </g>
  <g fill="#f1bd4a">
    <path d="m278 289-10-7v14z"/>
    <path d="m494 289-10-7v14z"/>
    <path d="m710 289-10-7v14z"/>
  </g>
  <rect x="70" y="410" width="826" height="112" rx="24" fill="#071a31" fill-opacity=".44" stroke="#90bce9" stroke-opacity=".35"/>
  <text x="102" y="454" fill="#9cc8f5" font-family="Arial, sans-serif" font-size="16" font-weight="700">ROUTER</text>
  <text x="102" y="490" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">普通问诊：结构完整与推理充分</text>
  <text x="528" y="490" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">急症问诊：风险提示与建议措施</text>
</svg>
